name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    name: Test and Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: payroll_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Monorepo & Backend Dependencies
        run: npm ci || npm install

      - name: Setup Server Environment Variables
        run: |
          echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/payroll_db?schema=public" >> server/.env
          echo "REDIS_HOST=localhost" >> server/.env
          echo "REDIS_PORT=6379" >> server/.env
          echo "PORT=5000" >> server/.env
          echo "NODE_ENV=test" >> server/.env

      - name: Generate Prisma Client & Sync Database Schema
        working-directory: ./server
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/payroll_db?schema=public
        run: |
          npx prisma generate
          npx prisma db push --accept-data-loss

      - name: Run Backend Automated Tests (Jest & Supertest)
        working-directory: ./server
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/payroll_db?schema=public
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          NODE_ENV: test
        run: npm test

      - name: Build Backend Service
        working-directory: ./server
        run: npm run build

      - name: Build Frontend Application
        working-directory: ./client
        run: |
          npm ci || npm install
          npm run build
